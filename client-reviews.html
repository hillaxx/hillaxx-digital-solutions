<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Reviews | HILLAXX</title><link rel="stylesheet" href="portal.css"><style>body{background:#f5f7fb}.rv-wrap{max-width:900px;margin:36px auto;padding:20px}.rv-card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:22px;margin:16px 0}.rv-card input,.rv-card textarea,.rv-card select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;margin:7px 0 14px;font:inherit}.rv-btn{padding:11px 16px;border:0;border-radius:9px;background:#172033;color:#fff;font-weight:650;cursor:pointer;margin:4px}.rv-muted{color:#667085}.rv-status{padding:10px;border-radius:9px;background:#f2f4f7;margin:12px 0}</style></head><body><main class="rv-wrap"><p><a href="client-portal.html">← Back to Client Hub</a></p><h1>Share your project experience</h1><p class="rv-muted">Reviews can be submitted for projects marked Completed. Your review is private until an administrator approves it.</p><div id="rv-message" class="rv-status" aria-live="polite">Checking your secure sign-in…</div><section class="rv-card"><h2>Write a review</h2><form id="rv-form"><label for="rv-project">Completed project</label><select id="rv-project" required><option value="">Choose a completed project</option></select><label for="rv-rating">Rating</label><select id="rv-rating" required><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select><label for="rv-text">Your review</label><textarea id="rv-text" rows="5" minlength="10" maxlength="1500" required placeholder="Tell us about your experience…"></textarea><label for="rv-name">Name to display (optional)</label><input id="rv-name" maxlength="80" placeholder="Your preferred display name"><label><input id="rv-show-name" type="checkbox" style="width:auto"> I consent to displaying this name publicly if my review is approved.</label><button class="rv-btn" type="submit">Submit review</button></form></section><section><h2>Your submitted reviews</h2><div id="rv-mine"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),cfg=window.HILLAXX_PORTAL_CONFIG;let db,user;const msg=(s)=>$('rv-message').textContent=s;
async function init(){if(!cfg||!window.supabase){msg('Portal configuration could not be loaded.');return;}db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await db.auth.getSession();if(!session){msg('Please sign in through the Client Hub first, then return here.');return;}user=session.user;const {data:p,error:pe}=await db.from('portal_profiles').select('role,status,full_name').eq('id',user.id).single();if(pe||!p||p.role!=='client'||p.status!=='approved'){msg('An approved client account is required to submit a review.');return;}if(p.full_name)$('rv-name').value=p.full_name;const {data:projects,error}=await db.from('portal_projects').select('id,title,status').eq('client_id',user.id).ilike('status','completed').order('created_at',{ascending:false});if(error){msg('Could not load your completed projects: '+error.message);return;}for(const pr of projects||[]){const o=document.createElement('option');o.value=pr.id;o.textContent=pr.title;$('rv-project').append(o);}msg('You are signed in. You may review a completed project.');await loadMine();}
async function loadMine(){const {data,error}=await db.from('hillaxx_client_reviews').select('id,project_id,rating,review_text,status,display_name,show_name').eq('client_id',user.id).order('created_at',{ascending:false});if(error){$('rv-mine').textContent='Your reviews could not be loaded.';return;}const box=$('rv-mine');box.replaceChildren();for(const r of data||[]){const card=document.createElement('article');card.className='rv-card';const h=document.createElement('h3');h.textContent=`${r.rating}/5 · ${r.status}`;const p=document.createElement('p');p.textContent=r.review_text;card.append(h,p);if(['pending','revision_requested'].includes(r.status)){const edit=document.createElement('button');edit.className='rv-btn';edit.textContent='Edit';edit.onclick=()=>{$('rv-project').value=r.project_id;$('rv-rating').value=String(r.rating);$('rv-text').value=r.review_text;$('rv-name').value=r.display_name||'';$('rv-show-name').checked=!!r.show_name;$('rv-form').dataset.editId=r.id;window.scrollTo({top:0,behavior:'smooth'});};const del=document.createElement('button');del.className='rv-btn';del.textContent='Withdraw';del.onclick=async()=>{if(!confirm('Withdraw this review?'))return;const {error}=await db.from('hillaxx_client_reviews').delete().eq('id',r.id);msg(error?error.message:'Review withdrawn.');await loadMine();};card.append(edit,del);}box.append(card);}}
$('rv-form').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;const editId=e.currentTarget.dataset.editId;const payload={project_id:$('rv-project').value,rating:Number($('rv-rating').value),review_text:$('rv-text').value.trim(),display_name:$('rv-name').value.trim()||null,show_name:$('rv-show-name').checked};let result;if(editId){result=await db.from('hillaxx_client_reviews').update(payload).eq('id',editId);delete e.currentTarget.dataset.editId;}else result=await db.from('hillaxx_client_reviews').insert({...payload,client_id:user.id});msg(result.error?'Could not save review: '+result.error.message:'Your review has been saved for administrator moderation.');if(!result.error){$('rv-form').reset();await loadMine();}});init();})();
</script></body></html>
