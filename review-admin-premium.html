<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Review Moderation | HILLAXX</title><link href="portal.css" rel="stylesheet"/><style>body{background:#f5f7fb}.wrap{max-width:1050px;margin:36px auto;padding:20px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:15px;padding:20px;margin:14px 0}.btn{padding:10px 14px;border:0;border-radius:8px;background:#172033;color:#fff;margin:5px;cursor:pointer}.muted{color:#667085}
/* HILLAXX premium administration finish */
:root{--navy:#101f35;--navy2:#1b3454;--gold:#c8a45d;--ink:#172538;--muted:#65748a;--line:#e4e9f0}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#edf1f6,#f7f8fa 320px);color:var(--ink);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:42px auto;padding:clamp(16px,3vw,30px)}
.wrap>p:first-child a{color:#8b6a2e;text-decoration:none;font-weight:750}
h1{color:var(--navy);font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;margin:14px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 14px 38px #172c490d}
.btn{padding:10px 16px;border:1px solid #1b3454;border-radius:9px;background:linear-gradient(135deg,#101f35,#1b3454);color:#fff;margin:5px;cursor:pointer;font-weight:700;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px #101f3525}
.muted{color:var(--muted)}
#msg{border-left:4px solid var(--gold)}
.hide-explanatory{display:none!important}
@media(max-width:600px){.wrap{margin:20px auto;padding:14px}.card{padding:17px}.btn{margin:4px 3px}}
</style></head><body><main class="wrap"><p><a href="portal-admin.html">← Back to Admin Dashboard</a></p><h1>Client review moderation</h1><p class="muted hide-explanatory">Only an approved HILLAXX administrator can access moderation actions.</p><div class="card" id="msg">Checking administrator access…</div><div id="reviews"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),cfg=window.HILLAXX_PORTAL_CONFIG;let db;function note(t){$('msg').textContent=t;}async function init(){if(!cfg||!window.supabase){note('Configuration unavailable.');return;}db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await db.auth.getSession();if(!session){note('Sign in through the Admin Dashboard first.');return;}const {data:p,error}=await db.from('portal_profiles').select('role,status').eq('id',session.user.id).single();if(error||!p||p.role!=='admin'||p.status!=='approved'){note('Administrator access required.');return;}note('Administrator verified. Reviews awaiting action are shown below.');await load();}async function load(){const {data,error}=await db.from('hillaxx_client_reviews').select('id,rating,review_text,display_name,show_name,status,featured,created_at,project_id,client_id').order('created_at',{ascending:false});if(error){note('Could not load reviews: '+error.message);return;}const box=$('reviews');box.replaceChildren();for(const r of data||[]){const c=document.createElement('article');c.className='card';const title=document.createElement('h3');title.textContent=`${r.rating}/5 · ${r.status}${r.featured?' · Featured':''}`;const body=document.createElement('p');body.textContent=r.review_text;const name=document.createElement('p');name.textContent=r.show_name&&r.display_name?'Public name: '+r.display_name:'Public attribution: Verified client';const actions=document.createElement('div');for(const [label,status] of [['Approve','approved'],['Reject','rejected'],['Request revision','revision_requested']]){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>change(r.id,{status});actions.append(b);}const feature=document.createElement('button');feature.className='btn';feature.textContent=r.featured?'Remove feature':'Feature';feature.onclick=()=>change(r.id,{featured:!r.featured});actions.append(feature);c.append(title,body,name,actions);box.append(c);}}async function change(id,patch){const {error}=await db.from('hillaxx_client_reviews').update(patch).eq('id',id);note(error?'Action failed: '+error.message:'Review updated.');if(!error)await load();}init();})();
</script></body></html>
